services:
  - type: web
    name: nanny-backend
    runtime: go
    rootDir: nanny-backend
    buildCommand: go build -o server main.go
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nanny-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: nanny-db
    databaseName: nanny
    user: nanny_user
    plan: free
